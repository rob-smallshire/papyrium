# Papyrium: one distribution, `papyrium`, holding the papyrium command and
# everything it prints with: core, languages, printer models, fonts,
# transports, outputs and advertisers.
#
# The code is a PEP 420 implicit namespace package (`papyrium`), so that a
# separately distributed extension can add modules beside these, such as
# papyrium.model.something, and register them on the entry-point axes
# below. There is never a src/papyrium/__init__.py.

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium"
version = "0.1.0"
description = "A virtual vintage printer: the bytes a computer sends its printer, printed as a 1980s dot-matrix printer would print them."
readme = "README-pypi.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
    "Topic :: System :: Emulators",
]
dependencies = [
    "asyoulikeit>=1.5.1",
    "click>=8.1.7",
    "exit-codes>=1.3",
    "ifaddr>=0.2",
    "pillow>=10.0",
    "stevedore>=5.0",
    "zeroconf>=0.151",
]

[project.scripts]
papyrium = "papyrium.cli:cli"

[project.urls]
Homepage = "https://github.com/rob-smallshire/papyrium"
Repository = "https://github.com/rob-smallshire/papyrium"
Issues = "https://github.com/rob-smallshire/papyrium/issues"

[project.entry-points."papyrium.advertiser"]
mdns = "papyrium.advertiser.mdns:MdnsAdvertiser"

[project.entry-points."papyrium.font"]
draft-9 = "papyrium.font.draft_9:Draft9Font"
lc10-block-graphics = "papyrium.font.lc10:LC10BlockGraphicsFont"
lc10-draft = "papyrium.font.lc10:LC10DraftFont"
lc10-draft-elite = "papyrium.font.lc10:LC10DraftEliteFont"
lc10-nlq-courier = "papyrium.font.lc10:LC10NlqCourierFont"
lc10-nlq-courier-elite = "papyrium.font.lc10:LC10NlqCourierEliteFont"
lc10-nlq-orator = "papyrium.font.lc10:LC10NlqOratorFont"
lc10-nlq-orator-elite = "papyrium.font.lc10:LC10NlqOratorEliteFont"
lc10-nlq-orator-small-capitals = "papyrium.font.lc10:LC10NlqOratorSmallCapitalsFont"
lc10-nlq-orator-small-capitals-elite = "papyrium.font.lc10:LC10NlqOratorSmallCapitalsEliteFont"
lc10-nlq-sanserif = "papyrium.font.lc10:LC10NlqSanserifFont"
lc10-nlq-sanserif-elite = "papyrium.font.lc10:LC10NlqSanserifEliteFont"
lx800-draft = "papyrium.font.lx800:LX800DraftFont"
lx800-nlq-roman = "papyrium.font.lx800:LX800NlqRomanFont"
m1109-draft = "papyrium.font.m1109:M1109DraftFont"
m1109-nlq = "papyrium.font.m1109:M1109NlqFont"

[project.entry-points."papyrium.language"]
escp = "papyrium.language.escp:EscpLanguage"
proprinter = "papyrium.language.proprinter:ProprinterLanguage"

[project.entry-points."papyrium.model"]
brother-m1109 = "papyrium.model.brother_m1109:BrotherM1109"
epson-fx80 = "papyrium.model.epson_fx80:EpsonFx80"
epson-lx800 = "papyrium.model.epson_lx800:EpsonLX800"
ibm-proprinter-ii = "papyrium.model.ibm_proprinter_ii:IBMProprinterII"
star-lc10 = "papyrium.model.star_lc10:StarLC10"
star-lc10-colour = "papyrium.model.star_lc10:StarLC10Colour"

[project.entry-points."papyrium.output"]
pdf = "papyrium.output.pdf:PdfOutput"
png = "papyrium.output.png:PngOutput"

[project.entry-points."papyrium.transport"]
raw-tcp = "papyrium.transport.raw_tcp:RawTcpTransport"

[tool.setuptools.packages.find]
where = ["src"]
include = ["papyrium*"]

[tool.setuptools.package-data]
# The dot fonts are data beside their modules.
"papyrium.font" = ["*/*.txt"]

[tool.uv]
default-groups = ["test", "lint", "readme", "release"]

# PyPI, not any index in a developer's own uv configuration, so that
# uv.lock records public URLs that CI and other contributors can fetch.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
test = [
    "pypdf>=5.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
lint = [
    "ruff>=0.16",
]
release = [
    "bump-my-version>=1.0",
]
readme = [
    "jinja2>=3.1.6",
    "pre-commit>=4.7.0",
]

# One version, bumped with
#     uv run bump-my-version bump minor   (or major, patch)
# which commits and tags v<version>; pushing the tag releases to PyPI.
[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump papyrium to {new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '^version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.pytest.ini_options]
# importlib mode is required for PEP 420 namespace packages.
minversion = "8.0"
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests/exception",
    "tests/extension",
    "tests/core",
    "tests/transport/raw_tcp",
    "tests/cli",
    "tests/output/png",
    "tests/font/draft_9",
    "tests/font/m1109",
    "tests/font/lx800",
    "tests/font/lc10",
    "tests/language/escp",
    "tests/language/proprinter",
    "tests/model/epson_fx80",
    "tests/model/brother_m1109",
    "tests/model/epson_lx800",
    "tests/model/star_lc10",
    "tests/model/ibm_proprinter_ii",
    "tests/output/pdf",
    "tests/advertiser/mdns",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F401", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["papyrium"]
