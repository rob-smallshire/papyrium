# Papyrium workspace root.
#
# This pyproject.toml serves two purposes:
#
# 1. It declares the uv workspace that stitches the packages/papyrium-*
#    members into one development environment.
#
# 2. It defines the bare `papyrium` distribution on PyPI, which ships no
#    code of its own: it depends on the papyrium command and every printer
#    model, and provides the `papyrium` command, so that `pip install
#    papyrium` or `uvx papyrium` gives a complete virtual printer.
#
# All members contribute to a single PEP 420 implicit namespace package
# (`papyrium`). No member ever ships src/papyrium/__init__.py.

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium"
version = "0.1.0"
description = "A virtual vintage printer: the papyrium command with every printer model."
readme = "README-pypi.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
    "Topic :: System :: Emulators",
]
dependencies = [
    "papyrium-cli>=0.1.0",
    "papyrium-model-epson-fx80>=0.1.0",
    "papyrium-model-brother-m1109>=0.1.0",
]

[project.scripts]
papyrium = "papyrium.cli:cli"

[project.urls]
Homepage = "https://github.com/rob-smallshire/papyrium"
Repository = "https://github.com/rob-smallshire/papyrium"
Issues = "https://github.com/rob-smallshire/papyrium/issues"

[tool.setuptools]
# The bare distribution ships no code, only dependencies and the command.
packages = []

[tool.uv.workspace]
members = ["packages/papyrium-*"]

[tool.uv.sources]
papyrium-output-pdf = { workspace = true }
papyrium-advertiser-mdns = { workspace = true }
papyrium-model-epson-fx80 = { workspace = true }
papyrium-model-brother-m1109 = { workspace = true }
papyrium-language-escp = { workspace = true }
papyrium-font-draft-9 = { workspace = true }
papyrium-font-m1109-draft = { workspace = true }
papyrium-font-m1109-nlq = { workspace = true }
papyrium-font-lx800-draft = { workspace = true }
papyrium-font-lx800-nlq-roman = { workspace = true }
papyrium-output-png = { workspace = true }
papyrium-cli = { workspace = true }
papyrium-transport-raw-tcp = { workspace = true }
papyrium-core = { workspace = true }
papyrium-exception = { workspace = true }
papyrium-extension = { workspace = true }

[tool.uv]
default-groups = ["test", "lint", "readme", "release", "workspace"]

# PyPI, not any index in a developer's own uv configuration, so that
# uv.lock records public URLs that CI and other contributors can fetch.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
# Installs every papyrium-* member editable in development.
workspace = [
    "papyrium-core",
    "papyrium-advertiser-mdns",
    "papyrium-transport-raw-tcp",
    "papyrium-cli",
    "papyrium-output-png",
    "papyrium-font-draft-9",
    "papyrium-font-m1109-draft",
    "papyrium-font-m1109-nlq",
    "papyrium-font-lx800-draft",
    "papyrium-font-lx800-nlq-roman",
    "papyrium-language-escp",
    "papyrium-model-epson-fx80",
    "papyrium-model-brother-m1109",
    "papyrium-output-pdf",
    "papyrium-exception",
    "papyrium-extension",
]
test = [
    "pypdf>=5.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
lint = [
    "ruff>=0.16",
]
release = [
    "bump-my-version>=1.0",
]
readme = [
    "jinja2>=3.1.6",
    "pre-commit>=4.7.0",
]

# Every distribution shares one version, bumped together with
#     uv run bump-my-version bump minor   (or major, patch)
# which commits and tags v<version>; pushing the tag releases to PyPI.
# A test checks that every installed papyrium distribution agrees.
[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump papyrium to {new_version}"
# The workspace members' versions are recorded in the lock file too.
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# The family's own dependencies on each other require the version
# released with them; a package depending on no other has none.
[[tool.bumpversion.files]]
glob = "pyproject.toml"
regex = true
search = '"(papyrium-[a-z0-9-]+)>={current_version}"'
replace = '"\1>={new_version}"'
ignore_missing_version = true

[[tool.bumpversion.files]]
glob = "packages/papyrium-*/pyproject.toml"
regex = true
search = '"(papyrium-[a-z0-9-]+)>={current_version}"'
replace = '"\1>={new_version}"'
ignore_missing_version = true

[[tool.bumpversion.files]]
filename = "packages/papyrium-advertiser-mdns/src/papyrium/advertiser/mdns/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-cli/src/papyrium/cli/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-core/src/papyrium/core/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-exception/src/papyrium/exception/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-extension/src/papyrium/extension/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-font-draft-9/src/papyrium/font/draft_9/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-font-m1109-draft/src/papyrium/font/m1109_draft/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-font-m1109-nlq/src/papyrium/font/m1109_nlq/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-font-lx800-draft/src/papyrium/font/lx800_draft/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-font-lx800-nlq-roman/src/papyrium/font/lx800_nlq_roman/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-language-escp/src/papyrium/language/escp/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-model-brother-m1109/src/papyrium/model/brother_m1109/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-model-epson-fx80/src/papyrium/model/epson_fx80/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-output-pdf/src/papyrium/output/pdf/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-output-png/src/papyrium/output/png/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/papyrium-transport-raw-tcp/src/papyrium/transport/raw_tcp/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.pytest.ini_options]
# importlib mode is required for PEP 420 namespace packages; the default
# prepend mode makes sibling packages in the same namespace collide.
minversion = "8.0"
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "packages/papyrium-exception/tests",
    "packages/papyrium-extension/tests",
    "packages/papyrium-core/tests",
    "packages/papyrium-transport-raw-tcp/tests",
    "packages/papyrium-cli/tests",
    "packages/papyrium-output-png/tests",
    "packages/papyrium-font-draft-9/tests",
    "packages/papyrium-font-m1109-draft/tests",
    "packages/papyrium-font-m1109-nlq/tests",
    "packages/papyrium-font-lx800-draft/tests",
    "packages/papyrium-font-lx800-nlq-roman/tests",
    "packages/papyrium-language-escp/tests",
    "packages/papyrium-model-epson-fx80/tests",
    "packages/papyrium-model-brother-m1109/tests",
    "packages/papyrium-output-pdf/tests",
    "packages/papyrium-advertiser-mdns/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F401", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["papyrium"]
