name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The release workflow runs these same checks before publishing.
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to test; by default the one that triggered the run.
        type: string
        default: ""

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependency environment (without papyrium itself)
        # Every third-party dependency, but not papyrium: that is installed
        # from a freshly built wheel below, so the tests run against the
        # distribution rather than the source tree. That catches packaging
        # bugs such as missing package data (fonts) or entry points.
        run: uv sync --no-install-project

      - name: Run namespace-init guard
        shell: bash
        run: sh scripts/check_no_namespace_init.sh

      - name: Run ruff
        run: uv run --no-sync ruff check

      - name: Check formatting
        run: uv run --no-sync ruff format --check

      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel into the test environment
        # bash so the glob expands the same on every runner OS.
        shell: bash
        run: uv pip install dist/*.whl

      - name: Check the code comes from the wheel
        # A papyrium module imported from src/ would mean the tests are
        # exercising the source tree, not what users install.
        shell: bash
        run: >-
          uv run --no-sync python -c
          "import papyrium.core, papyrium.cli, papyrium.font.draft_9 as f, pathlib, sys;
          paths = [pathlib.Path(p) for p in [*papyrium.core.__path__, *papyrium.cli.__path__, f.__file__]];
          bad = [p for p in paths if 'site-packages' not in p.parts];
          sys.exit(f'imported from the source tree: {bad}' if bad else 0)"

      - name: Run tests against the installed wheel
        # --no-sync stops uv re-syncing the environment, which would
        # reinstate the editable install, so pytest imports the wheel's code.
        run: uv run --no-sync pytest -v

      - name: Check generated READMEs are current
        # A consistency check of the committed READMEs and sample images,
        # not a per-platform test, so it runs on one platform only. It
        # prints with the installed wheel's papyrium command.
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: uv run --no-sync python scripts/render_readme.py --check
