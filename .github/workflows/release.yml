name: Release

# Triggered by a version tag (v0.1.0, ...), which
#     uv run bump-my-version bump minor   (or major, patch)
# creates. Runs the whole CI workflow on the tagged source first; only if it
# passes are the distributions built and published to PyPI.
#
# A release that stopped part way, for example when PyPI limits how many new
# projects may be created in a period, is resumed by running this workflow
# by hand for the same tag:
#     gh workflow run release.yml -f tag=v0.1.0
# Files already on PyPI are left out, so each run publishes what is missing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to release, such as v0.1.0
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  publish:
    name: Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"

      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match version $version" >&2
            exit 1
          fi

      - name: Build every distribution
        # --all-packages covers every workspace member and the root papyrium
        # distribution; the list of packages lives only in the workspace.
        # Timestamps come from the tagged commit, so the same tag always
        # builds the same files.
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          uv build --all-packages --out-dir dist/
          ls -la dist/

      - name: Check the distributions' metadata renders on PyPI
        run: uvx twine check --strict dist/*

      # The release tooling comes from the workflow's own commit, which for
      # a resumed release is newer than the tag.
      - name: Check out the release tooling
        uses: actions/checkout@v6
        with:
          path: release-tooling

      - name: Leave out files already on PyPI
        run: python release-tooling/scripts/leave_out_published.py dist/

      - name: Publish to PyPI
        shell: bash
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "everything is already published"
          else
            uv publish "${files[@]}"
          fi
