name: Release

# Triggered by a version tag (v0.1.0, ...), which
#     uv run bump-my-version bump minor   (or major, patch)
# creates. Runs the whole CI workflow first; only if it passes are the
# distributions built and published to PyPI.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"

      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

      - name: Build every distribution
        # --all-packages covers every workspace member and the root papyrium
        # distribution; the list of packages lives only in the workspace.
        run: |
          uv build --all-packages --out-dir dist/
          ls -la dist/

      - name: Check the distributions' metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*
