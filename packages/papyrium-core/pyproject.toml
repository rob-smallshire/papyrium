[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-core"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "Papyrium's extension axes, conformance suites, spooler and job captures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "papyrium-exception>=0.0.0",
    "papyrium-extension>=0.0.0",
]

[tool.setuptools.dynamic]
version = { attr = "papyrium.core.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
