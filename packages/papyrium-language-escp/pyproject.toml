[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-language-escp"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "The Epson ESC/P printer language for Papyrium's 9-pin dot-matrix models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "papyrium-core>=0.0.0",
    "papyrium-exception>=0.0.0",
    "papyrium-extension>=0.0.0",
]

[project.entry-points."papyrium.language"]
escp = "papyrium.language.escp:EscpLanguage"

[tool.setuptools.dynamic]
version = { attr = "papyrium.language.escp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
