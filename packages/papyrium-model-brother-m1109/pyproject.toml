[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-model-brother-m1109"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "The Brother M-1109 9-pin dot-matrix printer, emulated for Papyrium."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "papyrium-core>=0.0.0",
    "papyrium-extension>=0.0.0",
    "papyrium-font-draft-9>=0.0.0",
    "papyrium-language-escp>=0.0.0",
]

[project.entry-points."papyrium.model"]
brother-m1109 = "papyrium.model.brother_m1109:BrotherM1109"

[tool.setuptools.dynamic]
version = { attr = "papyrium.model.brother_m1109.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
