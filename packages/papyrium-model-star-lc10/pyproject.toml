[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-model-star-lc10"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "The Star LC-10 and LC-10 Colour 9-pin dot-matrix printers, emulated for Papyrium."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "papyrium-core>=0.1.0",
    "papyrium-extension>=0.1.0",
    "papyrium-font-lc10>=0.1.0",
    "papyrium-language-escp>=0.1.0",
]

[project.entry-points."papyrium.model"]
star-lc10 = "papyrium.model.star_lc10:StarLC10"
star-lc10-colour = "papyrium.model.star_lc10:StarLC10Colour"

[tool.setuptools.dynamic]
version = { attr = "papyrium.model.star_lc10.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
