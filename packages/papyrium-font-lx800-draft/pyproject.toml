[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-font-lx800-draft"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "lx800-draft, the Epson LX-800's draft characters, from its firmware, for Papyrium."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "papyrium-core>=0.1.0",
]

[project.entry-points."papyrium.font"]
lx800-draft = "papyrium.font.lx800_draft:LX800DraftFont"

[tool.setuptools.dynamic]
version = { attr = "papyrium.font.lx800_draft.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"papyrium.font.lx800_draft" = ["glyphs.txt"]
