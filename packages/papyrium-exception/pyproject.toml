[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-exception"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "Categorised exceptions and the CLI error-reporting boundary shared by Papyrium."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "exit-codes>=1.3",
]

[tool.setuptools.dynamic]
version = { attr = "papyrium.exception.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
