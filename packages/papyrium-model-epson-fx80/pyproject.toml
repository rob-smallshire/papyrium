[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-model-epson-fx80"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "The Epson FX-80 9-pin dot-matrix printer, emulated for Papyrium."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "papyrium-core>=0.0.0",
    "papyrium-extension>=0.0.0",
    "papyrium-font-draft-9>=0.0.0",
    "papyrium-language-escp>=0.0.0",
]

[project.entry-points."papyrium.model"]
epson-fx80 = "papyrium.model.epson_fx80:EpsonFx80"

[tool.setuptools.dynamic]
version = { attr = "papyrium.model.epson_fx80.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
