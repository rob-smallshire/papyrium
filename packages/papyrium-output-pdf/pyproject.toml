[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-output-pdf"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "PDF output for Papyrium: one document per job, dots as vector dots."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "papyrium-core>=0.0.0",
]

[project.entry-points."papyrium.output"]
pdf = "papyrium.output.pdf:PdfOutput"

[tool.setuptools.dynamic]
version = { attr = "papyrium.output.pdf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
