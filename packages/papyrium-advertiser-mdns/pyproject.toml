[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-advertiser-mdns"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "Announces Papyrium printers on the local network with multicast DNS (Bonjour, Avahi)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "papyrium-core>=0.0.0",
    "ifaddr>=0.2",
    "zeroconf>=0.151",
]

[project.entry-points."papyrium.advertiser"]
mdns = "papyrium.advertiser.mdns:MdnsAdvertiser"

[tool.setuptools.dynamic]
version = { attr = "papyrium.advertiser.mdns.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
