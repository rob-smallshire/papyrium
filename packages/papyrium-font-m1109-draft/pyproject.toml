[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-font-m1109-draft"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "m1109-draft, the Brother M-1109's draft characters, reconstructed for Papyrium."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "papyrium-core>=0.1.0",
]

[project.entry-points."papyrium.font"]
m1109-draft = "papyrium.font.m1109_draft:M1109DraftFont"

[tool.setuptools.dynamic]
version = { attr = "papyrium.font.m1109_draft.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"papyrium.font.m1109_draft" = ["glyphs.txt"]
