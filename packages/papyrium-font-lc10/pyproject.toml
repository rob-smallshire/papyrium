[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrium-font-lc10"
dynamic = ["version"]
authors = [{ name = "Robert Smallshire", email = "robert@smallshire.org.uk" }]
description = "The Star LC-10's draft and near letter quality fonts, draft and NLQ (Courier, Sanserif and Orator), pica and elite, from its firmware, for Papyrium."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "papyrium-core>=0.1.0",
]

[project.entry-points."papyrium.font"]
lc10-draft = "papyrium.font.lc10:LC10DraftFont"
lc10-draft-elite = "papyrium.font.lc10:LC10DraftEliteFont"
lc10-nlq-courier = "papyrium.font.lc10:LC10NlqCourierFont"
lc10-nlq-sanserif = "papyrium.font.lc10:LC10NlqSanserifFont"
lc10-nlq-orator = "papyrium.font.lc10:LC10NlqOratorFont"
lc10-nlq-orator-small-capitals = "papyrium.font.lc10:LC10NlqOratorSmallCapitalsFont"
lc10-nlq-courier-elite = "papyrium.font.lc10:LC10NlqCourierEliteFont"
lc10-nlq-sanserif-elite = "papyrium.font.lc10:LC10NlqSanserifEliteFont"
lc10-nlq-orator-elite = "papyrium.font.lc10:LC10NlqOratorEliteFont"
lc10-nlq-orator-small-capitals-elite = "papyrium.font.lc10:LC10NlqOratorSmallCapitalsEliteFont"

[tool.setuptools.dynamic]
version = { attr = "papyrium.font.lc10.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"papyrium.font.lc10" = ["*.txt"]
